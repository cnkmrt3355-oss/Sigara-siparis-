<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sigara Sipariş</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#77756e;--br:#e2e0d8;--ac:#1d6b4f;--acx:#fff;--bad:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161614;--card:#222220;--tx:#f0efe9;--mut:#9b9990;--br:#34332f;--ac:#4cc29a;--acx:#10231c;--bad:#f2b8b5}}
:root[data-theme="dark"]{--bg:#161614;--card:#222220;--tx:#f0efe9;--mut:#9b9990;--br:#34332f;--ac:#4cc29a;--acx:#10231c;--bad:#f2b8b5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font-family:inherit;cursor:pointer}
body{max-width:640px;margin:0 auto;padding-bottom:150px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 14px 10px;z-index:5;border-bottom:1px solid var(--br);display:flex;align-items:center;gap:10px}
header h1{font-size:20px;margin:0;flex:1}
#st{font-size:12px;color:var(--mut)}
.bk{border:0;background:none;color:var(--ac);font-size:16px;padding:6px 6px 6px 0}
.hint{margin:10px 14px 0;font-size:13px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px 14px}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
.bc{position:relative;aspect-ratio:1;border:1px solid var(--br);background:var(--card);color:var(--tx);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px}
.bc:active{transform:scale(.98)}
.bc em{position:absolute;top:10px;right:10px;background:var(--ac);color:var(--acx);font-style:normal;font-weight:700;font-size:13px;min-width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:0 7px}
.logo{width:60%;aspect-ratio:1;border-radius:22px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:28px;letter-spacing:.02em;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.logo.im{width:78%;aspect-ratio:1.3;background:#fff;border:1px solid var(--br);border-radius:16px;padding:8px;box-shadow:none}
.logo.im img{width:100%;height:100%;object-fit:contain;display:block}
.bn{font-size:16px;font-weight:700}
.bs{font-size:12px;color:var(--mut)}
.pc{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:8px;display:flex;flex-direction:column}
.pc.sel{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.art{aspect-ratio:1.25;background:var(--bg);border-radius:12px;display:flex;align-items:center;justify-content:center}
.pk{width:44%;aspect-ratio:3/4.2;border-radius:6px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 3px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.pk i{position:absolute;left:0;right:0;top:0;height:22%}
.pk b{font-size:10.5px;line-height:1.1;margin-top:18%;word-break:break-all}
.pk small{font-size:8px;line-height:1.1;margin-top:3px;opacity:.9}
.pn{font-size:13.5px;line-height:1.25;margin:8px 2px 0;min-height:34px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pp{font-size:11.5px;color:var(--mut);margin:2px 2px 0}
.ct{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.ct button{width:42px;height:42px;border-radius:50%;border:1px solid var(--br);background:var(--bg);color:var(--tx);font-size:22px;line-height:1}
.ct button.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.ct button:disabled{opacity:.3}
.nn{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.nn b{font-size:20px}.nn small{font-size:10px;color:var(--mut)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--br);border-radius:12px;margin:8px 14px;padding:10px 12px}
.nm{font-size:15px;line-height:1.25}.nm small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.row .ct{margin:0;gap:8px}.row .ct button{width:38px;height:38px;font-size:20px}
.sec{margin:14px 14px 4px;font-size:13px;color:var(--mut);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.sum{margin:14px 14px 0;font-size:15px}
.btn{display:block;width:calc(100% - 28px);margin:10px 14px;padding:13px;border-radius:12px;border:1px solid var(--ac);background:var(--ac);color:var(--acx);font-size:16px;font-weight:600}
.btn.sec2{background:var(--card);color:var(--bad);border-color:var(--br)}
.empty{text-align:center;color:var(--mut);margin:40px 20px;line-height:1.5}
textarea{width:calc(100% - 28px);margin:6px 14px;height:80px;border-radius:10px;border:1px solid var(--br);background:var(--card);color:var(--tx);padding:10px;font-size:14px;font-family:inherit}
input[type=search]{width:calc(100% - 28px);margin:12px 14px 0;padding:11px;border-radius:10px;border:1px solid var(--br);background:var(--card);color:var(--tx);font-size:15px}
.oc{background:var(--card);border:1px solid var(--br);border-radius:14px;margin:10px 14px;padding:12px}
.oh{display:flex;justify-content:space-between;gap:8px;font-size:14px}.oh span{color:var(--ac);font-weight:600}
.ou{font-size:12px;color:var(--mut);margin-top:2px}
.ob1{margin-top:10px;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.ol{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0}.ol b{white-space:nowrap}
.onote{margin-top:8px;font-size:13px;color:var(--mut)}
.oa{display:flex;gap:8px;margin-top:12px}
.oa button{flex:1;padding:10px 4px;border-radius:10px;border:1px solid var(--br);background:var(--bg);color:var(--tx);font-size:14px}
.oa button.dl{color:var(--bad)}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--br);border-radius:12px;margin:8px 14px;padding:12px}
.set small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.seg{display:flex;border:1px solid var(--br);border-radius:10px;overflow:hidden;flex:0 0 auto}
.seg button{border:0;background:var(--bg);color:var(--tx);padding:8px 11px;font-size:13px}
.seg button.on{background:var(--ac);color:var(--acx)}
.set input[type=number]{width:70px;padding:9px;border-radius:10px;border:1px solid var(--br);background:var(--bg);color:var(--tx);font-size:16px;text-align:center}
.uc{text-align:center;margin:30px 14px 10px}
.av{width:74px;height:74px;border-radius:50%;background:var(--ac);color:var(--acx);font-size:32px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.ue{font-size:17px;font-weight:600;word-break:break-all}.us{font-size:13px;color:var(--mut);margin-top:6px}
.ed{border:1px solid var(--br);background:var(--card);color:var(--tx);border-radius:10px;padding:7px 11px;font-size:13px}
.eb{display:flex;gap:6px;margin-top:8px}
.eb button{flex:1;padding:10px 4px;border-radius:10px;border:1px solid var(--br);background:var(--bg);color:var(--tx);font-size:12.5px}
.eb .dl{color:var(--bad)}
#md{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:25;display:none;align-items:center;justify-content:center;padding:20px}
#mf{width:100%;max-width:360px;background:var(--card);border:1px solid var(--br);border-radius:16px;padding:18px}
#mf h3{margin:0 0 12px;font-size:18px}
#mf input{width:100%;margin:0 0 10px;padding:12px;border-radius:10px;border:1px solid var(--br);background:var(--bg);color:var(--tx);font-size:16px}
#mf label{display:block;font-size:12px;color:var(--mut);margin:0 0 4px}
.mb{display:flex;gap:8px;margin-top:6px}
.mb button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--br);background:var(--bg);color:var(--tx);font-size:15px}
.mb button.ok{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
#cb{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;padding:0 14px;z-index:6}
#cb button{width:100%;padding:14px;border-radius:14px;border:0;background:var(--ac);color:var(--acx);font-size:16px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#nv{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--br);padding-bottom:env(safe-area-inset-bottom,0px);z-index:7}
#nv button{position:relative;border:0;background:none;color:var(--mut);padding:8px 0 9px;font-size:11px}
#nv button span{display:block;font-size:21px;line-height:1.2}
#nv button.on{color:var(--ac);font-weight:700}
#nv em{position:absolute;top:4px;left:calc(50% + 6px);background:var(--ac);color:var(--acx);font-style:normal;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;z-index:30;display:none}
#lg{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;align-items:center;justify-content:center;padding:20px}
#lg form{width:100%;max-width:360px}
#lg h2{margin:0 0 14px;font-size:22px}
#lg input{width:100%;margin:0 0 10px;padding:13px;border-radius:10px;border:1px solid var(--br);background:var(--card);color:var(--tx);font-size:16px}
#lg button{width:100%;padding:13px;border-radius:12px;border:0;background:var(--ac);color:var(--acx);font-size:16px;font-weight:600}
#lg button.lnk{background:none;color:var(--ac);font-weight:400;font-size:14px;margin-top:8px;padding:10px}
#er{color:var(--bad);font-size:14px;margin-top:10px;min-height:18px}
</style>
</head>
<body>
<header id="hd"></header>
<main id="main"></main>
<div id="cb"></div>
<nav id="nv"></nav>
<div id="ts"></div>
<div id="md"><form id="mf"><h3 id="mt"></h3>
<label for="mn">Sigara adı</label><input id="mn" maxlength="60" autocomplete="off" required>
<label for="mp">Paket fiyatı (₺)</label><input id="mp" type="number" inputmode="decimal" min="0" step="0.01">
<div class="mb"><button type="button" id="mc">İptal</button><button type="submit" class="ok">Kaydet</button></div></form></div>
<div id="lg"><form id="lf"><h2 id="lt">🚬 Sigara Sipariş</h2>
<input type="email" id="em" placeholder="E-posta" autocomplete="username" required>
<input type="password" id="pw" placeholder="Şifre" autocomplete="current-password" required>
<input type="password" id="pw2" placeholder="Şifre (tekrar)" autocomplete="new-password" style="display:none">
<button type="submit" id="sb">Giriş yap</button>
<button type="button" id="tg" class="lnk">Hesabın yok mu? Hesap oluştur</button><div id="er"></div></form></div>

 for(var k in PC)if(s.indexOf(k)===0)return PC[k];
 var hs=0,P=["#8b1a1a","#1b3a7a","#2f6f4f","#7a4a24","#5a3a7a","#b8860b","#0d5c63"];for(var q=0;q<s.length;q++)hs=(hs*31+s.charCodeAt(q))>>>0;return[P[hs%P.length],"#e8e0cc"]}
function pack(x){var c=packCol(x.n),f=lum(c[0])>150?"#222":"#fff",w=x.n.split(" "),r=w.slice(1).join(" ").slice(0,24);
 return '<div class="pk" style="background:'+c[0]+';color:'+f+'"><i style="background:'+c[1]+'"></i><b>'+esc(w[0].toUpperCase())+'</b><small>'+esc(r)+'</small></div>'}
// ekran parçaları
function prodCard(x){var n=Q[x.id]||0;
 return '<div class="pc'+(n?' sel':'')+'"><div class="art">'+pack(x)+'</div><div class="pn">'+esc(x.n)+'</div>'+(cfg.price?'<div class="pp">paket '+x.p+' ₺ · karton '+tl(x.p*cfg.ppk)+'</div>':'')+
 (editMode&&view==="grp"?'<div class="eb"><button data-act="eedit" data-x="'+x.id+'">✏️ Düzenle</button><button class="dl" data-act="edel" data-x="'+x.id+'">🗑 Sil</button></div></div>':'<div class="ct"><button data-i="'+x.id+'" data-d="-1"'+(n?'':' disabled')+'>−</button><span class="nn"><b>'+n+'</b><small>karton</small></span><button class="p" data-i="'+x.id+'" data-d="1">+</button></div></div>')}
function prodGrid(l){return '<div class="grid">'+l.map(prodCard).join('')+'</div>'}
function brandGrid(){return '<div class="grid">'+BR.map(function(b){var L=LOGO[b[1]],k=bcount(b[1]);
 return '<button class="bc" data-act="grp" data-g="'+b[1]+'">'+(k?'<em>'+k+'</em>':'')+'<div class="logo im"><img alt="'+esc(b[0])+'" src="'+L[2]+'"></div><div class="bn">'+esc(b[0])+'</div><div class="bs">'+ITEMS.filter(function(z){return z.bk===b[1]}).length+' ürün</div></button>'}).join('')+'</div>'}
function homeRes(){var q=sq.trim().toLocaleLowerCase("tr");if(!q)return brandGrid();
 var l=ITEMS.filter(function(x){return x.n.toLocaleLowerCase("tr").indexOf(q)>=0});
 return l.length?prodGrid(l):'<div class="empty">Bulunamadı.</div>'}
function row(x){var n=Q[x.id]||0;return '<div class="row"><div class="nm">'+esc(x.n)+(cfg.price?'<small>karton '+tl(x.p*cfg.ppk)+'</small>':'')+'</div><div class="ct"><button data-i="'+x.id+'" data-d="-1">−</button><span class="nn"><b>'+n+'</b><small>karton</small></span><button class="p" data-i="'+x.id+'" data-d="1">+</button></div></div>'}
function cartView(c){
 if(!c[0])return '<div class="empty">Sepet boş.<br>Ana ekrandan bir grup seçip + ile karton ekle.</div><button class="btn" data-act="home">Ana ekrana git</button>';
 var m='',last='';ITEMS.forEach(function(x){if(!Q[x.id])return;if(x.br!==last){m+='<div class="sec">'+esc(x.br)+'</div>';last=x.br}m+=row(x)});
 m+='<div class="sec">Not (isteğe bağlı)</div><textarea id="nt" placeholder="Sipariş notu">'+esc(note)+'</textarea>';
 m+='<div class="sum">Toplam: <b>'+c[0]+' karton</b> ('+c[0]*cfg.ppk+' paket)'+(cfg.price?' · <b>'+tl(c[1])+'</b>':'')+'</div>';
 return m+'<button class="btn" data-act="order">Siparişi oluştur</button><button class="btn sec2" data-act="clear">Sepeti temizle</button>'}
function ordersView(){var L=orders.slice().sort(function(a,b){return b.t-a.t});
 if(!L.length)return '<div class="empty">Henüz sipariş yok.<br>Sepetten sipariş oluşturunca burada görünür.</div>';
 return L.map(function(o){var last='',ln='';(o.it||[]).forEach(function(x){if(x.b!==last){ln+='<div class="ob1">'+esc(x.b)+'</div>';last=x.b}ln+='<div class="ol"><span>'+esc(x.n)+'</span><b>'+x.k+' karton</b></div>'});
  return '<div class="oc"><div class="oh"><b>'+fmt(o.t)+'</b><span>'+o.kt+' karton'+(cfg.price&&o.tl?' · '+tl(o.tl):'')+'</span></div>'+(o.u?'<div class="ou">'+esc(o.u)+'</div>':'')+ln+(o.nt?'<div class="onote">Not: '+esc(o.nt)+'</div>':'')+
  '<div class="oa"><button data-act="ocopy" data-o="'+esc(o.id)+'">Kopyala</button><button data-act="oredo" data-o="'+esc(o.id)+'">Sepete ekle</button><button class="dl" data-act="odel" data-o="'+esc(o.id)+'">Sil</button></div></div>'}).join('')}
function settingsView(){var th=[["auto","Otomatik"],["light","Açık"],["dark","Koyu"]];
 return '<div class="set"><div>Tema</div><div class="seg">'+th.map(function(t){return '<button data-act="theme" data-v="'+t[0]+'" class="'+(cfg.theme===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('')+'</div></div>'+
 '<div class="set"><div>Kartondaki paket sayısı<small>Fiyat ve paket hesabında kullanılır</small></div><input type="number" id="ppk" min="1" max="99" value="'+cfg.ppk+'"></div>'+
 '<div class="set"><div>Fiyatları göster</div><div class="seg"><button data-act="price" data-v="1" class="'+(cfg.price?'on':'')+'">Açık</button><button data-act="price" data-v="0" class="'+(cfg.price?'':'on')+'">Kapalı</button></div></div>'+
 '<button class="btn sec2" data-act="clear">Sepeti temizle</button><button class="btn sec2" data-act="catreset">Sigara listesini ilk haline döndür</button>'}
function userView(){var em=user&&user.email;
 return '<div class="uc"><div class="av">'+(em?esc(em[0].toUpperCase()):'?')+'</div><div class="ue">'+(em?esc(em):'Giriş yapılmadı')+'</div><div class="us">'+(em?'Sepet ve siparişler Firebase\'de saklanıyor':'Veriler sadece bu cihazda saklanıyor')+'</div></div>'+
 (em?'<button class="btn sec2" data-act="out">Çıkış yap</button>':(AUTH?'<button class="btn" data-act="login">Giriş yap</button>':''))}
function render(){
 var c=tot(),h,m;
 if(view==="grp")h='<button class="bk" data-act="home">‹ Ana ekran</button><h1>'+esc(brand(grp)[0])+'</h1>';
 else if(view==="cart")h='<button class="bk" data-act="home">‹ Geri</button><h1>Sepet</h1>';
 else h='<h1>'+T[view]+'</h1>';
 $("hd").innerHTML=h+'<span id="st">'+esc(stat)+'</span>'+(view==="grp"?'<button class="ed" data-act="edit">'+(editMode?'Bitti':'✏️ Düzenle')+'</button>':'');
 if(view==="home")m='<input type="search" id="q" placeholder="Tüm sigaralarda ara…" value="'+esc(sq)+'"><div id="res">'+homeRes()+'</div>';
 else if(view==="grp")m=(editMode?'<button class="btn" data-act="eadd">＋ Yeni sigara ekle</button><div class="hint">Düzenleme açık: adı/fiyatı değiştir ya da sil</div>':'<div class="hint">Her + bir karton ('+cfg.ppk+' paket) demek</div>')+prodGrid(ITEMS.filter(function(x){return x.bk===grp}));
 else if(view==="cart")m=cartView(c);
 else if(view==="orders")m=ordersView();
 else if(view==="settings")m=settingsView();
 else m=userView();
 $("main").innerHTML=m;
 $("cb").innerHTML=(c[0]&&(view==="home"||view==="grp"))?'<button data-act="cart">🛒 '+c[0]+' karton'+(cfg.price?' · '+tl(c[1]):'')+' — Sepeti gör</button>':'';
 var N=[["home","🏠","Ana Ekran"],["orders","📋","Siparişler"],["settings","⚙️","Ayarlar"],["user","👤","Kullanıcı"]];
 $("nv").innerHTML=N.map(function(n){var on=view===n[0]||(n[0]==="home"&&(view==="grp"||view==="cart"));
  return '<button data-act="'+n[0]+'" class="'+(on?'on':'')+'"><span>'+n[1]+'</span>'+n[2]+(n[0]==="orders"&&orders.length?'<em>'+orders.length+'</em>':'')+'</button>'}).join('')}
function go(v,g){view=v;editMode=false;if(g)grp=g;if(v==="home")sq="";render();window.scrollTo(0,0)}
function save(){if(!ref){lsSet("sg_q",Q);return}clearTimeout(timer);timer=setTimeout(function(){ref.set({q:Q,t:Date.now()}).then(function(){setStatus("✓ kaydedildi")}).catch(function(){setStatus("kaydedilemedi")})},350)}
function setQ(id,d){var n=Math.max(0,(Q[id]||0)+d);if(n)Q[id]=n;else delete Q[id];render();save()}
function otext(o){var out=["Sipariş – "+fmt(o.t)],last="";(o.it||[]).forEach(function(x){if(x.b!==last){out.push("");out.push(x.b+":");last=x.b}out.push("- "+x.n+": "+x.k+" karton")});if(o.nt)out.push("","Not: "+o.nt);return out.join("\n")}
function copy(t){var ok=false;try{var ta=document.createElement("textarea");ta.value=t;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();ok=document.execCommand("copy");document.body.removeChild(ta)}catch(x){}
 if(ok)toast("Kopyalandı ✓");else if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast("Kopyalandı ✓")},function(){toast("Kopyalanamadı")});else toast("Kopyalanamadı")}
function makeOrder(){var its=[];ITEMS.forEach(function(x){var n=Q[x.id]||0;if(n)its.push({i:x.id,b:x.br,n:x.n,k:n,p:x.p})});if(!its.length)return;
 var c=tot(),bq=Q,o={t:Date.now(),u:user?user.email:"",it:its,kt:c[0],tl:c[1],ppk:cfg.ppk,nt:note};
 if(oref){oref.push(o).catch(function(e){Q=bq;render();toast("Sipariş kaydedilemedi: "+(e&&e.code||"hata"))})}
 else{o.id="l"+o.t;orders.push(o);lsSet("sg_o",orders)}
 Q={};note="";save();toast("Sipariş kaydedildi ✓");go("orders")}
function findO(id){for(var i=0;i<orders.length;i++)if(orders[i].id===id)return orders[i]}
function act(a){var d=a.dataset,k=d.act,o;
 if(k==="home"||k==="orders"||k==="settings"||k==="user"||k==="cart")go(k);
 else if(k==="grp")go("grp",d.g);
 else if(k==="order")makeOrder();
 else if(k==="clear"){if(confirm("Sepet temizlensin mi?")){Q={};save();render()}}
 else if(k==="ocopy"){o=findO(d.o);if(o)copy(otext(o))}
 else if(k==="oredo"){o=findO(d.o);if(o){(o.it||[]).forEach(function(x){if(IT[x.i])Q[x.i]=(Q[x.i]||0)+x.k});save();toast("Sepete eklendi");go("cart")}}
 else if(k==="odel"){o=findO(d.o);if(o&&confirm("Sipariş silinsin mi?")){if(oref)oref.child(o.id).remove().catch(function(){toast("Silinemedi")});else{orders=orders.filter(function(z){return z!==o});lsSet("sg_o",orders);render()}}}
 else if(k==="theme"){cfg.theme=d.v;lsSet("sg_cfg",cfg);applyTheme();render()}
 else if(k==="price"){cfg.price=d.v==="1";lsSet("sg_cfg",cfg);render()}
 else if(k==="edit"){editMode=!editMode;render()}
 else if(k==="eadd")openMd(null)
 else if(k==="eedit")openMd(d.x)
 else if(k==="edel"){var x=IT[d.x];if(x&&confirm('"'+x.n+'" silinsin mi?')){if(x.base)cat.ov[x.id]={x:1};else delete cat.add[x.id];delete Q[x.id];save();saveCat();buildItems();render()}}
 else if(k==="catreset"){if(confirm("Düzenlenen, eklenen ve silinen tüm sigaralar ilk haline dönsün mü?")){cat={ov:{},add:{}};saveCat();buildItems();render();toast("Liste sıfırlandı")}}
 else if(k==="out"){if(AUTH)AUTH.signOut()}
 else if(k==="login")showLogin(true)}
document.addEventListener("click",function(e){
 var a=e.target.closest("[data-act]");if(a){act(a);return}
 var b=e.target.closest("[data-i]");if(b&&!b.disabled)setQ(b.dataset.i,+b.dataset.d)});
document.addEventListener("input",function(e){
 if(e.target.id==="q"){sq=e.target.value;var r=$("res");if(r)r.innerHTML=homeRes()}
 else if(e.target.id==="nt")note=e.target.value});
document.addEventListener("change",function(e){
 if(e.target.id==="ppk"){var v=parseInt(e.target.value,10);if(v>0&&v<100){cfg.ppk=v;lsSet("sg_cfg",cfg)}render()}});
// Firebase
function start(){
 var unsub=null;
 try{
  firebase.initializeApp(FIREBASE_CONFIG);
  var auth=AUTH=firebase.auth();
  var reg=false;
  function mode(r){reg=r;$("lt").textContent=r?"Hesap oluştur":"🚬 Sigara Sipariş";$("sb").textContent=r?"Hesap oluştur":"Giriş yap";
   $("tg").textContent=r?"Zaten hesabın var mı? Giriş yap":"Hesabın yok mu? Hesap oluştur";
   $("pw2").style.display=r?"block":"none";$("pw2").required=r;$("pw2").value="";
   $("pw").autocomplete=r?"new-password":"current-password";$("er").textContent=""}
  function msg(c){return({"auth/email-already-in-use":"Bu e-posta ile zaten hesap var, giriş yapmayı dene","auth/invalid-email":"Geçersiz e-posta adresi","auth/weak-password":"Şifre en az 6 karakter olmalı","auth/operation-not-allowed":"Firebase'de E-posta/Şifre girişi açık değil","auth/network-request-failed":"İnternet bağlantısı yok","auth/too-many-requests":"Çok fazla deneme, biraz bekle","auth/user-not-found":"E-posta veya şifre hatalı","auth/wrong-password":"E-posta veya şifre hatalı","auth/invalid-credential":"E-posta veya şifre hatalı"})[c]||"İşlem başarısız ("+c+")"}
  $("tg").addEventListener("click",function(){mode(!reg)});
  $("lf").addEventListener("submit",function(e){e.preventDefault();$("er").textContent="";
   var em=$("em").value.trim(),pw=$("pw").value;
   if(reg){
    if(pw.length<6){$("er").textContent=msg("auth/weak-password");return}
    if(pw!==$("pw2").value){$("er").textContent="Şifreler aynı değil";return}
    $("sb").disabled=true;
    auth.createUserWithEmailAndPassword(em,pw).catch(function(x){$("er").textContent=msg(x.code)}).then(function(){$("sb").disabled=false});
   }else{
    $("sb").disabled=true;
    auth.signInWithEmailAndPassword(em,pw).catch(function(x){$("er").textContent=msg(x.code)}).then(function(){$("sb").disabled=false});
   }});
  auth.onAuthStateChanged(function(u){
   user=u;
   if(unsub){unsub();unsub=null}
   if(!u){ref=null;oref=null;cref=null;Q={};orders=[];setStatus("");showLogin(true);render();return}
   showLogin(false);
   var db=firebase.database();
   ref=db.ref("siparis/liste");oref=db.ref("siparis/kayitlar");cref=db.ref("siparis/katalog");
   var cb=ref.on("value",function(snap){var d=snap.val();Q=(d&&d.q)||{};setStatus("canlı ●");render()},function(){setStatus("sepet okunamadı (veritabanı kuralları?)")});
   var cb2=oref.on("value",function(snap){var d=snap.val()||{};orders=Object.keys(d).map(function(k){var o=d[k];o.id=k;return o});render()},function(){setStatus("siparişler okunamadı (veritabanı kuralları?)")});
   var cb3=cref.on("value",function(snap){var d=snap.val();if(d===null){if(Object.keys(cat.ov).length||Object.keys(cat.add).length)cref.set(cat);return}cat={ov:d.ov||{},add:d.add||{}};lsSet("sg_cat",cat);buildItems();render()},function(){setStatus("sigara listesi okunamadı (veritabanı kuralları?)")});
   var r0=ref,r1=oref,r2=cref;unsub=function(){r0.off("value",cb);r1.off("value",cb2);r2.off("value",cb3)};
   render();
  });
 }catch(e){setStatus("Firebase hatası: "+(e&&e.message||e));showLogin(false);render();console.error(e)}
}
$("mc").addEventListener("click",function(){$("md").style.display="none"});
$("mf").addEventListener("submit",function(e){e.preventDefault();var n=$("mn").value.trim(),pr=parseFloat($("mp").value);if(!n)return;if(!(pr>=0))pr=0;
 if(editId){var x=IT[editId];if(x&&x.base){var o=cat.ov[editId]||{};o.n=n;o.p=pr;cat.ov[editId]=o}else if(cat.add[editId]){cat.add[editId].n=n;cat.add[editId].p=pr}}
 else cat.add["n"+Date.now()]={bk:grp,n:n,p:pr,t:Date.now()};
 saveCat();buildItems();$("md").style.display="none";render()});
applyTheme();setStatus("yükleniyor…");render();
(function(){
 var F=[["app","initializeApp"],["database","database"],["auth","auth"]];
 function ld(src,ok,bad){var s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=bad;document.head.appendChild(s)}
 function all(base,done,fail){var i=0;(function n(){
  if(i>=F.length)return done();var f=F[i++];
  if(window.firebase&&firebase[f[1]])return n();
  ld(base(f[0]),n,fail)})()}
 var g=function(n){return"https://www.gstatic.com/firebasejs/10.12.2/firebase-"+n+"-compat.js"};
 var j=function(n){return"https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-"+n+"-compat.js"};
 all(g,start,function(){all(j,start,function(){setStatus("Firebase yüklenemedi — veriler bu cihazda");render()})});
})();
</script>
